[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"dreamerv3/agent.py" = ["E731"]
"dreamerv3/main.py" = ["E402", "E731"]
"dreamerv3/rssm.py" = ["E731"]
"embodied/__init__.py" = ["F401", "F403"]
"embodied/core/__init__.py" = ["F401"]
"embodied/core/replay.py" = ["E731"]
"embodied/envs/minecraft_flat.py" = ["E402"]
"embodied/jax/__init__.py" = ["F401"]
"embodied/jax/agent.py" = ["E402", "E731"]
"embodied/jax/internal.py" = ["E731"]
"embodied/jax/nets.py" = ["E731"]
"embodied/jax/utils.py" = ["E731"]
"embodied/run/__init__.py" = ["F401"]
"embodied/run/eval_only.py" = ["E731"]
"embodied/run/parallel.py" = ["E731"]
"embodied/run/train.py" = ["E731"]
"embodied/run/train_eval.py" = ["E731"]
"embodied/tests/test_driver.py" = ["E731"]
"embodied/tests/test_float_images.py" = ["F401"]
"embodied/tests/test_from_gym.py" = ["F401"]
"embodied/tests/test_layer_scan.py" = ["E731"]
"embodied/tests/test_policy_sync.py" = ["E731"]
"plot.py" = ["E731"]
"scores/view.py" = ["F401"]

[tool.basedpyright]
include = ["dreamerv3", "embodied", "plot.py", "scores/view.py", "setup.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
